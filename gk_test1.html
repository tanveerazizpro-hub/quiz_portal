<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Knowledge - Test 1</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: var(--surface);
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1, h2, h3 { text-align: center; margin-top: 0; }
        .hidden { display: none !important; }

        #progress-bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Question Palette / Number Jump Grid */
        .palette-container {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
        }
        .palette-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            text-align: center;
        }
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
            gap: 6px;
        }
        .palette-btn {
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: var(--text);
            padding: 6px 0;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .palette-btn:hover {
            background: #e2e8f0;
        }
        .palette-btn.active {
            border: 2px solid var(--primary);
            color: var(--primary);
            font-weight: 700;
        }
        .palette-btn.answered {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .palette-btn.active.answered {
            outline: 2px solid #0f172a;
            outline-offset: 1px;
        }

        .question-header { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; }
        .options-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        
        .option-label {
            display: flex; align-items: center; padding: 12px 16px;
            border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; transition: all 0.2s;
        }
        .option-label:hover { background-color: #f1f5f9; }
        .option-label.correct-bg { background-color: #dcfce7; border-color: var(--success); }
        .option-label.incorrect-bg { background-color: #fee2e2; border-color: var(--danger); }
        .option-label input { margin-right: 12px; transform: scale(1.2); }
        
        .btn {
            background-color: var(--primary); color: white; border: none;
            padding: 12px 20px; border-radius: 6px; font-size: 1rem;
            font-weight: 600; cursor: pointer; transition: background 0.2s;
            width: 100%; margin-bottom: 10px;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-outline { background-color: transparent; color: var(--primary); border: 2px solid var(--primary); }
        .btn-outline:hover { background-color: #eff6ff; }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        
        .explanation {
            background: #f1f5f9; padding: 15px; border-radius: 8px;
            margin-bottom: 20px; font-size: 0.95rem; border-left: 4px solid var(--primary);
        }

        /* Bottom Nav Row */
        .nav-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
        }
        .nav-controls .btn {
            margin-bottom: 0;
            flex: 1;
        }

        /* Flashcard Styles */
        .flashcard-container { perspective: 1000px; width: 100%; height: 300px; margin: 30px 0; cursor: pointer; }
        .flashcard {
            width: 100%; height: 100%; position: relative; transition: transform 0.6s;
            transform-style: preserve-3d; border-radius: 12px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
        .flashcard.is-flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; align-items: center; justify-content: center; padding: 20px;
            box-sizing: border-box; border-radius: 12px; font-size: 1.25rem; text-align: center;
        }
        .card-front { background-color: var(--primary); color: white; }
        .card-back { background-color: var(--surface); color: var(--text); border: 2px solid var(--primary); transform: rotateY(180deg); }
        .flashcard-controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .flashcard-controls button { width: auto; flex: 1; }
        .instruction { text-align: center; color: var(--text-light); font-size: 0.85rem; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    
    <!-- QUIZ SECTION -->
    <div id="quiz-section">
        <h2 id="round-title">Test 1</h2>
        <div id="progress-bar"><div id="progress-fill"></div></div>

        <!-- Question Number Palette -->
        <div class="palette-container">
            <div class="palette-title">Question Navigator</div>
            <div class="palette-grid" id="palette-grid"></div>
        </div>
        
        <div id="quiz-content">
            <div class="question-header" id="question-text">Loading question...</div>
            <div class="instruction" id="question-instruction"></div>
            <div class="options-grid" id="options-container"></div>
            <div id="explanation-box" class="explanation hidden"></div>
            
            <button id="submit-btn" class="btn" onclick="submitAnswer()">Submit Answer</button>
            <button id="show-answer-btn" class="btn btn-outline" onclick="showAnswer()">Show Answer & Explanation</button>

            <!-- Previous and Next Navigation Bar -->
            <div class="nav-controls">
                <button id="prev-btn" class="btn btn-outline" onclick="prevQuestion()">← Previous</button>
                <button id="finish-btn" class="btn btn-outline" style="background:#16a34a;color:white;border-color:#16a34a;" onclick="finishQuiz()">Finish Quiz</button>
                <button id="next-btn" class="btn btn-outline" onclick="nextQuestion()">Next →</button>
            </div>
        </div>

        <div id="quiz-results" class="hidden">
            <h2>Quiz Complete!</h2>
            <h1 id="final-score">0 / 20</h1>
            <p style="text-align: center; margin-bottom: 25px;">Review finished! Proceed below to study the high-yield facts.</p>
            <button class="btn" onclick="startFlashcards()">Proceed to Topic Facts Flashcards</button>
            <button class="btn btn-outline" onclick="reviewQuestions()">Review Questions</button>
        </div>
    </div>

    <!-- FLASHCARD SECTION -->
    <div id="flashcard-section" class="hidden">
        <h2>Topic Facts Flashcards</h2>
        <p class="instruction">Click or tap the card to flip between the Topic and the Fact.</p>
        
        <div class="flashcard-container" onclick="flipCard()">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front" id="card-front">Topic</div>
                <div class="card-face card-back" id="card-back">Fact</div>
            </div>
        </div>
        <p style="text-align: center; font-weight: bold;" id="card-counter">1 / 5</p>
        <div class="flashcard-controls">
            <button class="btn btn-outline" onclick="prevCard()">Previous</button>
            <button class="btn btn-outline" onclick="nextCard()">Next</button>
        </div>
        <a href="index.html" style="text-decoration:none;"><button class="btn" style="margin-top: 20px;">Back to Main Menu</button></a>
    </div>
</div>

<script>
    const quizData = [
        { round: "Test 1", text: "Which ancient Indian text is traditionally associated with the phrase 'Satyameva Jayate'?", type: "single", options: ["Rigveda", "Mundaka Upanishad", "Arthashastra", "Bhagavad Gita"], correct: [1], exp: "The phrase means 'Truth alone triumphs' and comes from the Mundaka Upanishad." },
        { round: "Test 1", text: "Who was the first woman to become the President of the Indian National Congress?", type: "single", options: ["Sarojini Naidu", "Annie Besant", "Vijaya Lakshmi Pandit", "Sucheta Kripalani"], correct: [1], exp: "Annie Besant became Congress president in 1917." },
        { round: "Test 1", text: "Which Indian state was the first to be formed on a linguistic basis after independence?", type: "single", options: ["Gujarat", "Kerala", "Andhra State", "Karnataka"], correct: [2], exp: "Andhra State was created in 1953, largely for Telugu-speaking people." },
        { round: "Test 1", text: "The ancient city of Petra is located in which present-day country?", type: "single", options: ["Egypt", "Jordan", "Lebanon", "Iraq"], correct: [1], exp: "Petra, famous for its rock-cut architecture, is in Jordan." },
        { round: "Test 1", text: "Which of these was an ancient centre of learning in present-day Bihar?", type: "single", options: ["Taxila", "Nalanda", "Hampi", "Madurai"], correct: [1], exp: "Nalanda was a major ancient Buddhist learning centre in Bihar." },
        { round: "Test 1", text: "Who was the first person to reach the South Pole?", type: "single", options: ["Robert Falcon Scott", "Ernest Shackleton", "Roald Amundsen", "Edmund Hillary"], correct: [2], exp: "Roald Amundsen reached the South Pole in December 1911." },
        { round: "Test 1", text: "Which Indian classical dance form originated in Assam?", type: "single", options: ["Kathak", "Sattriya", "Kuchipudi", "Mohiniyattam"], correct: [1], exp: "Sattriya developed in Assam and is one of India's classical dance forms." },
        { round: "Test 1", text: "Which organisation publishes the annual Human Development Report?", type: "single", options: ["UNESCO", "UNDP", "UNICEF", "World Bank"], correct: [1], exp: "The United Nations Development Programme publishes the Human Development Report." },
        { round: "Test 1", text: "The Bretton Woods Conference helped establish which pair of institutions?", type: "single", options: ["WHO and UNESCO", "IMF and World Bank", "WTO and ILO", "NATO and OECD"], correct: [1], exp: "The conference laid the foundations for the IMF and International Bank for Reconstruction and Development, part of the World Bank Group." },
        { round: "Test 1", text: "Which is the only continent crossed by all lines of longitude?", type: "single", options: ["Asia", "Africa", "Antarctica", "Europe"], correct: [2], exp: "All meridians meet at the North and South Poles; Antarctica surrounds the South Pole." },
        { round: "Test 1", text: "Who wrote the historical novel Anandamath?", type: "single", options: ["Rabindranath Tagore", "Bankim Chandra Chattopadhyay", "Sarat Chandra Chattopadhyay", "Premchand"], correct: [1], exp: "Bankim Chandra Chattopadhyay wrote 'Anandamath', first published in the 1880s." },
        { round: "Test 1", text: "Which country gifted the Statue of Liberty to the United States?", type: "single", options: ["Spain", "France", "Italy", "Germany"], correct: [1], exp: "France presented the Statue of Liberty to the United States." },
        { round: "Test 1", text: "What is the currency of South Korea?", type: "single", options: ["Yen", "Yuan", "Won", "Ringgit"], correct: [2], exp: "South Korea uses the won." },
        { round: "Test 1", text: "Which Indian freedom fighter was popularly known as 'Frontier Gandhi'?", type: "single", options: ["Maulana Azad", "Khan Abdul Ghaffar Khan", "Lala Lajpat Rai", "Bhagat Singh"], correct: [1], exp: "Khan Abdul Ghaffar Khan was known as Frontier Gandhi." },
        { round: "Test 1", text: "The headquarters of the International Court of Justice is in which city?", type: "single", options: ["Geneva", "New York", "The Hague", "Vienna"], correct: [2], exp: "The International Court of Justice is based in The Hague, Netherlands." },
        { round: "Test 1", text: "Which Indian monument was built by Maharaja Sawai Pratap Singh?", type: "single", options: ["Charminar", "Hawa Mahal", "Victoria Memorial", "Gateway of India"], correct: [1], exp: "Hawa Mahal in Jaipur was commissioned by Sawai Pratap Singh and completed in 1799." },
        { round: "Test 1", text: "Which sea lies between the Arabian Peninsula and northeastern Africa?", type: "single", options: ["Baltic Sea", "Red Sea", "Black Sea", "Caspian Sea"], correct: [1], exp: "The Red Sea separates the Arabian Peninsula from northeastern Africa." },
        { round: "Test 1", text: "Who was the first Indian to win an individual Olympic gold medal?", type: "single", options: ["Neeraj Chopra", "Abhinav Bindra", "Rajyavardhan Rathore", "Leander Paes"], correct: [1], exp: "Abhinav Bindra won the 10 m air rifle gold at the 2008 Beijing Olympics." },
        { round: "Test 1", text: "Which planet is named after the Roman god of war?", type: "single", options: ["Venus", "Mars", "Jupiter", "Mercury"], correct: [1], exp: "Mars is named after the Roman god of war." },
        { round: "Test 1", text: "Which Indian state is home to the living root bridges made by training tree roots?", type: "single", options: ["Sikkim", "Meghalaya", "Nagaland", "Tripura"], correct: [1], exp: "Living root bridges are especially associated with Meghalaya." }
    ];

    const flashcardsData = [
        { topic: "National motto of India", fact: "Satyameva Jayate ('Truth alone triumphs')" },
        { topic: "First Indian woman to climb Mount Everest", fact: "Bachendri Pal (1984)" },
        { topic: "World Health Organization Headquarters", fact: "Geneva, Switzerland" },
        { topic: "World's largest hot desert", fact: "The Sahara Desert" },
        { topic: "Composer of 'Vande Mataram'", fact: "Bankim Chandra Chattopadhyay" }
    ];

    // State tracking for each question
    const userAnswers = Array(quizData.length).fill(null).map(() => ({
        selected: [],
        submitted: false,
        revealed: false,
        isCorrect: false
    }));

    let currentQ = 0;
    let currentFact = 0;

    // Elements
    const qTitle = document.getElementById("round-title");
    const qText = document.getElementById("question-text");
    const qInst = document.getElementById("question-instruction");
    const optionsContainer = document.getElementById("options-container");
    const expBox = document.getElementById("explanation-box");
    const submitBtn = document.getElementById("submit-btn");
    const showAnsBtn = document.getElementById("show-answer-btn");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const progressFill = document.getElementById("progress-fill");
    const paletteGrid = document.getElementById("palette-grid");

    function initPalette() {
        paletteGrid.innerHTML = "";
        quizData.forEach((_, idx) => {
            const btn = document.createElement("button");
            btn.className = "palette-btn";
            btn.id = `palette-btn-${idx}`;
            btn.innerText = idx + 1;
            btn.onclick = () => jumpToQuestion(idx);
            paletteGrid.appendChild(btn);
        });
    }

    function updatePalette() {
        quizData.forEach((_, idx) => {
            const btn = document.getElementById(`palette-btn-${idx}`);
            btn.classList.toggle("active", idx === currentQ);
            btn.classList.toggle("answered", userAnswers[idx].submitted || userAnswers[idx].revealed);
        });
    }

    function loadQuestion() {
        const q = quizData[currentQ];
        const state = userAnswers[currentQ];

        qTitle.innerText = `${q.round} (Question ${currentQ + 1} of ${quizData.length})`;
        qText.innerText = q.text;
        qInst.innerText = q.type === "multi" ? "Select multiple answers:" : "Select one answer:";
        
        const answeredCount = userAnswers.filter(a => a.submitted || a.revealed).length;
        progressFill.style.width = `${(answeredCount / quizData.length) * 100}%`;

        optionsContainer.innerHTML = "";
        expBox.innerHTML = `<strong>Explanation:</strong> ${q.exp}`;

        prevBtn.disabled = (currentQ === 0);
        nextBtn.disabled = (currentQ === quizData.length - 1);

        q.options.forEach((opt, index) => {
            const label = document.createElement("label");
            label.className = "option-label";
            label.id = `label-${index}`;
            
            const input = document.createElement("input");
            input.type = q.type === "multi" ? "checkbox" : "radio";
            input.name = "quiz-option";
            input.value = index;
            input.checked = state.selected.includes(index);
            input.disabled = (state.submitted || state.revealed);

            input.onchange = () => {
                state.selected = getSelectedInputs();
            };

            label.appendChild(input);
            label.appendChild(document.createTextNode(opt));
            optionsContainer.appendChild(label);
        });

        if (state.submitted || state.revealed) {
            highlightAnswers();
            expBox.classList.remove("hidden");
            submitBtn.classList.add("hidden");
            showAnsBtn.classList.add("hidden");
        } else {
            expBox.classList.add("hidden");
            submitBtn.classList.remove("hidden");
            showAnsBtn.classList.remove("hidden");
        }

        updatePalette();
    }

    function getSelectedInputs() {
        const inputs = document.querySelectorAll('input[name="quiz-option"]:checked');
        return Array.from(inputs).map(i => parseInt(i.value));
    }

    function highlightAnswers() {
        const q = quizData[currentQ];
        const state = userAnswers[currentQ];

        q.options.forEach((_, i) => {
            const lbl = document.getElementById(`label-${i}`);
            if (q.correct.includes(i)) {
                lbl.classList.add("correct-bg");
            } else if (state.selected.includes(i)) {
                lbl.classList.add("incorrect-bg");
            }
        });
    }

    function lockQuestion(revealedOnly = false) {
        const q = quizData[currentQ];
        const state = userAnswers[currentQ];
        state.selected = getSelectedInputs();

        if (revealedOnly) {
            state.revealed = true;
            state.isCorrect = false;
        } else {
            state.submitted = true;
            const correctSet = [...q.correct].sort().join(",");
            const selectedSet = [...state.selected].sort().join(",");
            state.isCorrect = (correctSet === selectedSet);
        }

        document.querySelectorAll('input[name="quiz-option"]').forEach(i => i.disabled = true);
        highlightAnswers();
        expBox.classList.remove("hidden");
        submitBtn.classList.add("hidden");
        showAnsBtn.classList.add("hidden");
        updatePalette();

        const answeredCount = userAnswers.filter(a => a.submitted || a.revealed).length;
        progressFill.style.width = `${(answeredCount / quizData.length) * 100}%`;
    }

    function submitAnswer() {
        const selected = getSelectedInputs();
        if (selected.length === 0) {
            alert("Please select an answer first.");
            return;
        }
        lockQuestion(false);
    }

    function showAnswer() {
        lockQuestion(true);
    }

    function jumpToQuestion(idx) {
        currentQ = idx;
        loadQuestion();
    }

    function nextQuestion() {
        if (currentQ < quizData.length - 1) {
            currentQ++;
            loadQuestion();
        }
    }

    function prevQuestion() {
        if (currentQ > 0) {
            currentQ--;
            loadQuestion();
        }
    }

    function finishQuiz() {
        const totalCorrect = userAnswers.filter(a => a.isCorrect).length;

        document.getElementById("quiz-content").classList.add("hidden");
        document.getElementById("progress-bar").classList.add("hidden");
        document.getElementById("round-title").classList.add("hidden");
        document.querySelector(".palette-container").classList.add("hidden");

        const resultsDiv = document.getElementById("quiz-results");
        resultsDiv.classList.remove("hidden");
        document.getElementById("final-score").innerText = `${totalCorrect} / ${quizData.length}`;
    }

    function reviewQuestions() {
        document.getElementById("quiz-results").classList.add("hidden");
        document.getElementById("quiz-content").classList.remove("hidden");
        document.getElementById("progress-bar").classList.remove("hidden");
        document.getElementById("round-title").classList.remove("hidden");
        document.querySelector(".palette-container").classList.remove("hidden");
        currentQ = 0;
        loadQuestion();
    }

    // Flashcard Functions
    function startFlashcards() {
        document.getElementById("quiz-section").classList.add("hidden");
        document.getElementById("flashcard-section").classList.remove("hidden");
        loadFact();
    }

    function loadFact() {
        const f = flashcardsData[currentFact];
        document.getElementById("card-front").innerText = f.topic;
        document.getElementById("card-back").innerText = f.fact;
        document.getElementById("card-counter").innerText = `${currentFact + 1} / ${flashcardsData.length}`;
        document.getElementById("flashcard").classList.remove("is-flipped");
    }

    function flipCard() {
        document.getElementById("flashcard").classList.toggle("is-flipped");
    }

    function nextCard() {
        currentFact = (currentFact + 1) % flashcardsData.length;
        loadFact();
    }

    function prevCard() {
        currentFact = (currentFact - 1 + flashcardsData.length) % flashcardsData.length;
        loadFact();
    }

    initPalette();
    loadQuestion();
</script>
</body>
</html>
