<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Knowledge - Test 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #4a90e2; --bg-gradient-start: #f5f7fa; --bg-gradient-end: #c3cfe2; --text-dark: #2c3e50; --card-bg: rgba(255, 255, 255, 0.95); --correct-color: #27ae60; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%); min-height: 100vh; padding: 40px 20px; color: var(--text-dark); }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 2.5rem; color: var(--primary-color); }
        .btn-back { display: inline-block; margin-bottom: 20px; text-decoration: none; color: var(--text-dark); border: 2px solid #cbd5e1; padding: 8px 20px; border-radius: 20px; transition: all 0.3s; }
        .btn-back:hover { background: var(--text-dark); color: white; }
        .q-card { background: var(--card-bg); border-radius: 15px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .q-text { font-size: 1.2rem; font-weight: 600; margin-bottom: 15px; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .opt-btn { text-align: left; padding: 12px 20px; border: 1px solid #e2e8f0; border-radius: 10px; background: white; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .opt-btn:hover { border-color: var(--primary-color); background: #f0f7ff; }
        .explanation { display: none; margin-top: 15px; padding: 15px; background: #e8f5e9; border-left: 4px solid var(--correct-color); border-radius: 4px; color: #1b5e20; }
        .explanation.show { display: block; animation: fadeIn 0.4s; }
        .flashcards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 40px; }
        .flashcard { background: transparent; perspective: 1000px; height: 150px; cursor: pointer; }
        .flashcard-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .flashcard-front { background: var(--primary-color); color: white; font-weight: 500; }
        .flashcard-back { background: var(--correct-color); color: white; transform: rotateY(180deg); font-size: 0.95rem; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="btn-back">← Back to Portal</a>
        <div class="header">
            <h1>Test 1: General Knowledge</h1>
            <p>Read the question, guess the answer, then click any option to reveal the explanation.</p>
        </div>
        <div id="quiz-feed"></div>
        <div class="header" style="margin-top: 50px;">
            <h2>Quick-Revision Flashcards</h2>
            <p>Click to flip and reveal the answer</p>
        </div>
        <div class="flashcards-grid" id="fc-feed"></div>
    </div>
    <script>
        const data = [
            {q: '1. Which ancient Indian text is traditionally associated with the phrase "Satyameva Jayate"?', opts: ['A. Rigveda', 'B. Mundaka Upanishad', 'C. Arthashastra', 'D. Bhagavad Gita'], ans: 1, exp: 'The phrase means "Truth alone triumphs" and comes from the Mundaka Upanishad.'},
            {q: '2. Who was the first woman to become the President of the Indian National Congress?', opts: ['A. Sarojini Naidu', 'B. Annie Besant', 'C. Vijaya Lakshmi Pandit', 'D. Sucheta Kripalani'], ans: 1, exp: 'Annie Besant became Congress president in 1917.'},
            {q: '3. Which Indian state was the first to be formed on a linguistic basis after independence?', opts: ['A. Gujarat', 'B. Kerala', 'C. Andhra State', 'D. Karnataka'], ans: 2, exp: 'Andhra State was created in 1953, largely for Telugu-speaking people.'},
            {q: '4. The ancient city of Petra is located in which present-day country?', opts: ['A. Egypt', 'B. Jordan', 'C. Lebanon', 'D. Iraq'], ans: 1, exp: 'Petra, famous for its rock-cut architecture, is in Jordan.'},
            {q: '5. Which of these was an ancient centre of learning in present-day Bihar?', opts: ['A. Taxila', 'B. Nalanda', 'C. Hampi', 'D. Madurai'], ans: 1, exp: 'Nalanda was a major ancient Buddhist learning centre in Bihar.'},
            {q: '6. Who was the first person to reach the South Pole?', opts: ['A. Robert Falcon Scott', 'B. Ernest Shackleton', 'C. Roald Amundsen', 'D. Edmund Hillary'], ans: 2, exp: 'Roald Amundsen reached the South Pole in December 1911.'},
            {q: '7. Which Indian classical dance form originated in Assam?', opts: ['A. Kathak', 'B. Sattriya', 'C. Kuchipudi', 'D. Mohiniyattam'], ans: 1, exp: 'Sattriya developed in Assam and is one of India\'s classical dance forms.'},
            {q: '8. Which organisation publishes the annual Human Development Report?', opts: ['A. UNESCO', 'B. UNDP', 'C. UNICEF', 'D. World Bank'], ans: 1, exp: 'The United Nations Development Programme publishes the Human Development Report.'},
            {q: '9. The Bretton Woods Conference helped establish which pair of institutions?', opts: ['A. WHO and UNESCO', 'B. IMF and World Bank', 'C. WTO and ILO', 'D. NATO and OECD'], ans: 1, exp: 'The conference laid the foundations for the IMF and International Bank for Reconstruction and Development, part of the World Bank Group.'},
            {q: '10. Which is the only continent crossed by all lines of longitude?', opts: ['A. Asia', 'B. Africa', 'C. Antarctica', 'D. Europe'], ans: 2, exp: 'All meridians meet at the North and South Poles; Antarctica surrounds the South Pole.'},
            {q: '11. Who wrote the historical novel Anandamath?', opts: ['A. Rabindranath Tagore', 'B. Bankim Chandra Chattopadhyay', 'C. Sarat Chandra Chattopadhyay', 'D. Premchand'], ans: 1, exp: 'Bankim Chandra Chattopadhyay wrote "Anandamath", first published in the 1880s.'},
            {q: '12. Which country gifted the Statue of Liberty to the United States?', opts: ['A. Spain', 'B. France', 'C. Italy', 'D. Germany'], ans: 1, exp: 'France presented the Statue of Liberty to the United States.'},
            {q: '13. What is the currency of South Korea?', opts: ['A. Yen', 'B. Yuan', 'C. Won', 'D. Ringgit'], ans: 2, exp: 'South Korea uses the won.'},
            {q: '14. Which Indian freedom fighter was popularly known as "Frontier Gandhi"?', opts: ['A. Maulana Azad', 'B. Khan Abdul Ghaffar Khan', 'C. Lala Lajpat Rai', 'D. Bhagat Singh'], ans: 1, exp: 'Khan Abdul Ghaffar Khan was known as Frontier Gandhi.'},
            {q: '15. The headquarters of the International Court of Justice is in which city?', opts: ['A. Geneva', 'B. New York', 'C. The Hague', 'D. Vienna'], ans: 2, exp: 'The International Court of Justice is based in The Hague, Netherlands.'},
            {q: '16. Which Indian monument was built by Maharaja Sawai Pratap Singh?', opts: ['A. Charminar', 'B. Hawa Mahal', 'C. Victoria Memorial', 'D. Gateway of India'], ans: 1, exp: 'Hawa Mahal in Jaipur was commissioned by Sawai Pratap Singh and completed in 1799.'},
            {q: '17. Which sea lies between the Arabian Peninsula and northeastern Africa?', opts: ['A. Baltic Sea', 'B. Red Sea', 'C. Black Sea', 'D. Caspian Sea'], ans: 1, exp: 'The Red Sea separates the Arabian Peninsula from northeastern Africa.'},
            {q: '18. Who was the first Indian to win an individual Olympic gold medal?', opts: ['A. Neeraj Chopra', 'B. Abhinav Bindra', 'C. Rajyavardhan Rathore', 'D. Leander Paes'], ans: 1, exp: 'Abhinav Bindra won the 10 m air rifle gold at the 2008 Beijing Olympics.'},
            {q: '19. Which planet is named after the Roman god of war?', opts: ['A. Venus', 'B. Mars', 'C. Jupiter', 'D. Mercury'], ans: 1, exp: 'Mars is named after the Roman god of war.'},
            {q: '20. Which Indian state is home to the living root bridges made by training tree roots?', opts: ['A. Sikkim', 'B. Meghalaya', 'C. Nagaland', 'D. Tripura'], ans: 1, exp: 'Living root bridges are especially associated with Meghalaya.'}
        ];
        const flashcards = [
            {q: 'What is the national motto of India?', a: 'Satyameva Jayate, meaning "Truth alone triumphs."'},
            {q: 'Who was the first Indian woman to climb Mount Everest?', a: 'Bachendri Pal, in 1984.'},
            {q: 'Where is the headquarters of the World Health Organization?', a: 'Geneva, Switzerland.'},
            {q: 'Which is the largest hot desert in the world?', a: 'The Sahara Desert.'},
            {q: 'Who composed India\'s national song, "Vande Mataram"?', a: 'Bankim Chandra Chattopadhyay.'}
        ];

        const feed = document.getElementById('quiz-feed');
        data.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'q-card';
            let optsHtml = item.opts.map((opt, i) => `<button class="opt-btn" onclick="reveal(${index})">${opt}</button>`).join('');
            card.innerHTML = `<div class="q-text">${item.q}</div><div class="options">${optsHtml}</div><div class="explanation" id="exp-${index}"><strong>Correct Answer: ${item.opts[item.ans]}</strong><br><br>${item.exp}</div>`;
            feed.appendChild(card);
        });

        const fcFeed = document.getElementById('fc-feed');
        flashcards.forEach((fc) => {
            fcFeed.innerHTML += `<div class="flashcard" onclick="this.classList.toggle('flipped')"><div class="flashcard-inner"><div class="flashcard-front">${fc.q}</div><div class="flashcard-back">${fc.a}</div></div></div>`;
        });

        function reveal(id) { document.getElementById(`exp-${id}`).classList.add('show'); }
    </script>
</body>
</html>
