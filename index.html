<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterSchool Quiz Competition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4a90e2;
            --primary-hover: #357abd;
            --bg-gradient-start: #f5f7fa;
            --bg-gradient-end: #c3cfe2;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
            --card-bg: rgba(255, 255, 255, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 40px;
            backdrop-filter: blur(10px);
            text-align: center;
            overflow: hidden;
            position: relative;
            min-height: 500px;
        }

        /* Screen transitions */
        .screen {
            display: none;
            animation: fadeIn 0.5s ease-in-out forwards;
        }
        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Typography */
        h1 {
            font-size: 2.5rem;
            color: var(--text-dark);
            margin-bottom: 10px;
            font-weight: 700;
        }
        p.subtitle {
            color: var(--text-light);
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        /* Button Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        /* Styling the Cards/Buttons */
        .btn-card {
            background: white;
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 30px 20px;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary-color);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .btn-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 12px 20px rgba(74, 144, 226, 0.2);
            background: var(--primary-color);
            color: white;
        }

        /* Secondary Buttons (For Tests) - Updated for Anchor Tags */
        .test-btn {
            background: white;
            border: 1px solid #e1e8ed;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            text-decoration: none; /* Prevents underline on links */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .test-btn:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(74, 144, 226, 0.2);
        }

        /* Back Button */
        .btn-back {
            margin-top: 40px;
            padding: 10px 25px;
            background: transparent;
            border: 2px solid var(--text-light);
            color: var(--text-light);
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-back:hover {
            background: var(--text-light);
            color: white;
        }

        /* Subject Header on Test Screen */
        #dynamic-subject-title {
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 2rem;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ================= HOME SCREEN ================= -->
        <div id="home-screen" class="screen active">
            <h1>InterSchool Quiz Competition</h1>
            <p class="subtitle">Select your discipline to begin your journey</p>
            
            <div class="grid-container">
                <button class="btn-card" onclick="openSubject('Mathematics')">
                    Mathematics
                </button>
                <button class="btn-card" onclick="openSubject('Science')">
                    Science
                </button>
                <button class="btn-card" onclick="openSubject('General Knowledge')">
                    General Knowledge
                </button>
            </div>
        </div>

        <!-- ================= TESTS SCREEN ================= -->
        <div id="tests-screen" class="screen">
            <h2 id="dynamic-subject-title">Subject Name</h2>
            <p class="subtitle">Select a test module to start</p>
            
            <div class="grid-container" id="test-buttons-container">
                <!-- Test links will be injected here dynamically by JavaScript -->
            </div>

            <button class="btn-back" onclick="goBack()">← Back to Subjects</button>
        </div>

    </div>

    <script>
        // DOM Elements
        const homeScreen = document.getElementById('home-screen');
        const testsScreen = document.getElementById('tests-screen');
        const subjectTitle = document.getElementById('dynamic-subject-title');
        const testButtonsContainer = document.getElementById('test-buttons-container');

        // File routing logic for different subjects
        const subjectRoutes = {
            'General Knowledge': ['gk_test1.html', 'gk_test2.html', 'gk_test3.html', 'gk_test4.html'],
            'Mathematics': ['#', '#', '#', '#'], // Placeholders until math tests are created
            'Science': ['science_test1.html', 'science_test2.html', 'science_test3.html', 'science_test4.html'] 
        };

        // Function to open the tests screen for a specific subject
        function openSubject(subjectName) {
            // Update the title
            subjectTitle.textContent = subjectName;
            
            // Clear previous buttons
            testButtonsContainer.innerHTML = '';

            // Generate the 4 test links dynamically based on the selected subject
            const routes = subjectRoutes[subjectName];
            for (let i = 0; i < 4; i++) {
                const a = document.createElement('a');
                a.className = 'test-btn';
                a.textContent = `Test ${i + 1}`;
                
                if (routes[i] === '#') {
                    // If it's a placeholder, prevent default linking and show an alert
                    a.href = '#';
                    a.onclick = (e) => {
                        e.preventDefault();
                        alert(`${subjectName} modules are currently under construction!`);
                    };
                } else {
                    // Link directly to the specific HTML file
                    a.href = routes[i];
                }
                
                testButtonsContainer.appendChild(a);
            }
            
            // Hide Home, Show Tests
            homeScreen.classList.remove('active');
            
            // Slight delay to allow animation to feel smooth
            setTimeout(() => {
                testsScreen.classList.add('active');
            }, 50);
        }

        // Function to go back to the home screen
        function goBack() {
            // Hide Tests, Show Home
            testsScreen.classList.remove('active');
            
            setTimeout(() => {
                homeScreen.classList.add('active');
            }, 50);
        }
    </script>

</body>
</html>
