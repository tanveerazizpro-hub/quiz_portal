<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Portal</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #0f172a;
        }
        .menu-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .btn {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: background 0.2s;
            width: 80%;
            margin-top: 20px;
        }
        .btn:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

<div class="menu-container">
    <h1>My Quiz Portal</h1>
    <p>Select a test below to begin playing.</p>
    <!-- This button links directly to your test1.html file -->
    <a href="test1.html" class="btn">Test 1</a>
</div>

</body>
</html>
