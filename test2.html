<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inter-School Quiz & Flashcards - Test 2</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: var(--surface);
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1, h2, h3 { text-align: center; margin-top: 0; }
        .hidden { display: none !important; }

        #progress-bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Question Palette / Number Jump Grid */
        .palette-container {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
        }
        .palette-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            text-align: center;
        }
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
            gap: 6px;
        }
        .palette-btn {
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: var(--text);
            padding: 6px 0;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .palette-btn:hover {
            background: #e2e8f0;
        }
        .palette-btn.active {
            border: 2px solid var(--primary);
            color: var(--primary);
            font-weight: 700;
        }
        .palette-btn.answered {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .palette-btn.active.answered {
            outline: 2px solid #0f172a;
            outline-offset: 1px;
        }

        .question-header { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; }
        .options-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        
        .option-label {
            display: flex; align-items: center; padding: 12px 16px;
            border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; transition: all 0.2s;
        }
        .option-label:hover { background-color: #f1f5f9; }
        .option-label.correct-bg { background-color: #dcfce7; border-color: var(--success); }
        .option-label.incorrect-bg { background-color: #fee2e2; border-color: var(--danger); }
        .option-label input { margin-right: 12px; transform: scale(1.2); }
        
        .btn {
            background-color: var(--primary); color: white; border: none;
            padding: 12px 20px; border-radius: 6px; font-size: 1rem;
            font-weight: 600; cursor: pointer; transition: background 0.2s;
            width: 100%; margin-bottom: 10px;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-outline { background-color: transparent; color: var(--primary); border: 2px solid var(--primary); }
        .btn-outline:hover { background-color: #eff6ff; }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        
        .explanation {
            background: #f1f5f9; padding: 15px; border-radius: 8px;
            margin-bottom: 20px; font-size: 0.95rem; border-left: 4px solid var(--primary);
        }

        /* Bottom Nav Row */
        .nav-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
        }
        .nav-controls .btn {
            margin-bottom: 0;
            flex: 1;
        }

        /* Flashcard Styles */
        .flashcard-container { perspective: 1000px; width: 100%; height: 300px; margin: 30px 0; cursor: pointer; }
        .flashcard {
            width: 100%; height: 100%; position: relative; transition: transform 0.6s;
            transform-style: preserve-3d; border-radius: 12px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
        .flashcard.is-flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; align-items: center; justify-content: center; padding: 20px;
            box-sizing: border-box; border-radius: 12px; font-size: 1.25rem; text-align: center;
        }
        .card-front { background-color: var(--primary); color: white; }
        .card-back { background-color: var(--surface); color: var(--text); border: 2px solid var(--primary); transform: rotateY(180deg); }
        .flashcard-controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .flashcard-controls button { width: auto; flex: 1; }
        .instruction { text-align: center; color: var(--text-light); font-size: 0.85rem; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    
    <!-- QUIZ SECTION -->
    <div id="quiz-section">
        <h2 id="round-title">Quiz Championship</h2>
        <div id="progress-bar"><div id="progress-fill"></div></div>

        <!-- Question Number Palette -->
        <div class="palette-container">
            <div class="palette-title">Question Navigator</div>
            <div class="palette-grid" id="palette-grid"></div>
        </div>
        
        <div id="quiz-content">
            <div class="question-header" id="question-text">Loading question...</div>
            <div class="instruction" id="question-instruction"></div>
            <div class="options-grid" id="options-container"></div>
            <div id="explanation-box" class="explanation hidden"></div>
            
            <button id="submit-btn" class="btn" onclick="submitAnswer()">Submit Answer</button>
            <button id="show-answer-btn" class="btn btn-outline" onclick="showAnswer()">Show Answer & Explanation</button>

            <!-- Previous and Next Navigation Bar -->
            <div class="nav-controls">
                <button id="prev-btn" class="btn btn-outline" onclick="prevQuestion()">← Previous</button>
                <button id="finish-btn" class="btn btn-outline" style="background:#16a34a;color:white;border-color:#16a34a;" onclick="finishQuiz()">Finish Quiz</button>
                <button id="next-btn" class="btn btn-outline" onclick="nextQuestion()">Next →</button>
            </div>
        </div>

        <div id="quiz-results" class="hidden">
            <h2>Quiz Complete!</h2>
            <h1 id="final-score">0 / 30</h1>
            <p style="text-align: center; margin-bottom: 25px;">Review finished! Proceed below to study the high-yield facts.</p>
            <button class="btn" onclick="startFlashcards()">Proceed to Topic Facts Flashcards</button>
            <button class="btn btn-outline" onclick="reviewQuestions()">Review Questions</button>
        </div>
    </div>

    <!-- FLASHCARD SECTION -->
    <div id="flashcard-section" class="hidden">
        <h2>Topic Facts Flashcards</h2>
        <p class="instruction">Click or tap the card to flip between the Topic and the Fact.</p>
        
        <div class="flashcard-container" onclick="flipCard()">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front" id="card-front">Topic</div>
                <div class="card-face card-back" id="card-back">Fact</div>
            </div>
        </div>
        <p style="text-align: center; font-weight: bold;" id="card-counter">1 / 15</p>
        <div class="flashcard-controls">
            <button class="btn btn-outline" onclick="prevCard()">Previous</button>
            <button class="btn btn-outline" onclick="nextCard()">Next</button>
        </div>
        <a href="index.html" style="text-decoration:none;"><button class="btn" style="margin-top: 20px;">Back to Main Menu</button></a>
    </div>
</div>

<script>
    const quizData = [
        // Round 4
        { round: "Round 4", text: "Who was the first Indian to win an individual Olympic gold medal?", type: "single", options: ["Leander Paes", "Abhinav Bindra", "Rajyavardhan Singh Rathore", "Neeraj Chopra"], correct: [1], exp: "Abhinav Bindra won gold in the 10m Air Rifle event at the 2008 Beijing Olympics." },
        { round: "Round 4", text: "Which blood component is mainly responsible for clotting?", type: "single", options: ["White blood cells", "Plasma", "Platelets", "Red blood cells"], correct: [2], exp: "Platelets (thrombocytes) clump together to form clots and stop bleeding." },
        { round: "Round 4", text: "If the mean of five numbers is 18, what is their total sum?", type: "single", options: ["90", "72", "108", "23"], correct: [0], exp: "Mean = Total Sum / Number of items. Total sum = 18 × 5 = 90." },
        { round: "Round 4", text: "Which treaty formally established the European Union in 1993?", type: "single", options: ["Treaty of Maastricht", "Treaty of Rome", "Treaty of Versailles", "Treaty of Lisbon"], correct: [0], exp: "The Treaty of Maastricht, signed in 1992 and effective in 1993, formally created the European Union." },
        { round: "Round 4", text: "Who wrote the play 'Waiting for Godot'?", type: "single", options: ["Samuel Beckett", "Harold Pinter", "Arthur Miller", "George Bernard Shaw"], correct: [0], exp: "Samuel Beckett wrote the famous absurdist play 'Waiting for Godot'." },
        { round: "Round 4", text: "Which Indian percussion instrument is traditionally played in a pair of drums?", type: "single", options: ["Mridangam", "Dholak", "Tabla", "Ghatam"], correct: [2], exp: "The tabla consists of two hand drums, the dayan (right) and bayan (left)." },
        { round: "Round 4", text: "Which is the only continent crossed by both the Equator and the Tropic of Capricorn?", type: "single", options: ["North America", "Europe", "Asia", "Africa"], correct: [3], exp: "Africa is the only continent crossed by the Equator, the Tropic of Cancer, and the Tropic of Capricorn." },
        { round: "Round 4", text: "Which TWO of these are renewable energy sources? Select every correct answer.", type: "multi", options: ["Solar energy", "Natural gas", "Wind energy", "Coal"], correct: [0, 2], exp: "Solar and wind are renewable, while natural gas and coal are fossil fuels." },
        { round: "Round 4", text: "The chemical symbol Ag for silver comes from its Latin name, argentum.", type: "single", options: ["True", "False"], correct: [0], exp: "True. The Latin word for silver is argentum, which gives the symbol Ag." },
        { round: "Round 4", text: "Which country won the ICC Men's T20 Cricket World Cup in 2024?", type: "single", options: ["England", "New Zealand", "Australia", "India"], correct: [3], exp: "India won the 2024 ICC Men's T20 World Cup, defeating South Africa in the final." },

        // Round 5
        { round: "Round 5", text: "Which Indian state has the longest coastline among India's states?", type: "single", options: ["Tamil Nadu", "Gujarat", "Maharashtra", "Andhra Pradesh"], correct: [1], exp: "Gujarat has the longest coastline in India, measuring around 1,600 km." },
        { round: "Round 5", text: "Which part of a eukaryotic cell is primarily responsible for producing most of its ATP during aerobic respiration?", type: "single", options: ["Ribosome", "Lysosome", "Golgi apparatus", "Mitochondrion"], correct: [3], exp: "Mitochondria are known as the powerhouse of the cell because they generate most of the cell's ATP." },
        { round: "Round 5", text: "A fair six-sided die is rolled once. What is the probability of getting a prime number?", type: "single", options: ["2/3", "1/3", "1/6", "1/2"], correct: [3], exp: "The prime numbers on a die are 2, 3, and 5. The probability is 3/6, which simplifies to 1/2." },
        { round: "Round 5", text: "Which organisation administers the International Court of Justice, the principal judicial organ of the United Nations?", type: "single", options: ["World Trade Organization", "International Criminal Court", "International Court of Arbitration", "United Nations"], correct: [3], exp: "The ICJ is the principal judicial organ of the United Nations." },
        { round: "Round 5", text: "Which novel begins with the famous line 'Call me Ishmael'?", type: "single", options: ["The Old Man and the Sea", "Treasure Island", "Moby-Dick", "Robinson Crusoe"], correct: [2], exp: "'Call me Ishmael' is the famous opening line of Herman Melville's 'Moby-Dick'." },
        { round: "Round 5", text: "Which composer wrote the famous orchestral work 'The Four Seasons'?", type: "single", options: ["Ludwig van Beethoven", "Wolfgang Amadeus Mozart", "Antonio Vivaldi", "Johann Sebastian Bach"], correct: [2], exp: "Antonio Vivaldi composed the series of violin concertos known as 'The Four Seasons'." },
        { round: "Round 5", text: "Which strait connects the Mediterranean Sea with the Atlantic Ocean?", type: "single", options: ["Dardanelles", "Bosporus Strait", "Strait of Gibraltar", "Dover Strait"], correct: [2], exp: "The Strait of Gibraltar connects the Atlantic Ocean to the Mediterranean Sea." },
        { round: "Round 5", text: "Which TWO are major consequences of excess nutrient runoff entering lakes and rivers? Select every correct answer.", type: "multi", options: ["Algal blooms", "Guaranteed increase in biodiversity", "Oxygen depletion", "Permanent increase in drinking-water purity"], correct: [0, 2], exp: "Excess nutrients lead to eutrophication, causing algal blooms and subsequent oxygen depletion (hypoxia)." },
        { round: "Round 5", text: "The SI unit of frequency is the hertz, equivalent to one cycle per second.", type: "single", options: ["True", "False"], correct: [0], exp: "True. One hertz equals one cycle per second." },
        { round: "Round 5", text: "Which city hosted the 2024 Summer Olympic Games?", type: "single", options: ["Brisbane", "Paris", "Los Angeles", "Tokyo"], correct: [1], exp: "Paris hosted the 2024 Summer Olympic Games." },

        // Round 6
        { round: "Round 6", text: "Which Indian freedom fighter founded the Indian Home Rule League in 1916 and was also a prominent theosophist?", type: "single", options: ["Sarojini Naidu", "Aruna Asaf Ali", "Annie Besant", "Madam Bhikaji Cama"], correct: [2], exp: "Annie Besant launched the Home Rule League in September 1916 and was a leading theosophist." },
        { round: "Round 6", text: "Which planet has the shortest day, meaning the fastest rotation on its axis, among the eight planets?", type: "single", options: ["Mars", "Earth", "Jupiter", "Neptune"], correct: [2], exp: "Jupiter rotates the fastest of all solar system planets, completing a day in just under 10 hours." },
        { round: "Round 6", text: "What is the value of 2³ × 2⁴?", type: "single", options: ["2⁷ = 128", "2¹ = 2", "4⁷ = 16384", "2¹² = 4096"], correct: [0], exp: "Using laws of exponents, a^m × a^n = a^(m+n). So, 2³ × 2⁴ = 2⁷ = 128." },
        { round: "Round 6", text: "Which international organisation publishes the annual Human Development Report?", type: "single", options: ["UNESCO", "UN Development Programme", "International Labour Organization", "World Health Organization"], correct: [1], exp: "The United Nations Development Programme (UNDP) publishes the Human Development Report annually." },
        { round: "Round 6", text: "Who wrote 'Things Fall Apart', a novel about Igbo society and colonialism in Nigeria?", type: "single", options: ["Ngũgĩ wa Thiong'o", "Wole Soyinka", "Ben Okri", "Chinua Achebe"], correct: [3], exp: "Chinua Achebe's 'Things Fall Apart' is a seminal African novel about Igbo society." },
        { round: "Round 6", text: "Which Indian classical vocalist was famously associated with the Kirana gharana and received the Bharat Ratna in 2008?", type: "single", options: ["M. S. Subbulakshmi", "Pandit Ravi Shankar", "Pandit Bhimsen Joshi", "Ustad Bismillah Khan"], correct: [2], exp: "Pandit Bhimsen Joshi was a legendary vocalist of the Kirana gharana and received the Bharat Ratna in 2008." },
        { round: "Round 6", text: "Which is the world's largest island, excluding continents?", type: "single", options: ["Greenland", "Borneo", "New Guinea", "Madagascar"], correct: [0], exp: "Greenland is the world's largest non-continental island." },
        { round: "Round 6", text: "Which TWO actions can help reduce human-caused climate change? Select every correct answer.", type: "multi", options: ["Increasing methane leaks from fossil-fuel systems", "Replacing coal power with low-carbon electricity", "Burning more fossil fuels without emission controls", "Protecting and restoring forests"], correct: [1, 3], exp: "Transitioning to low-carbon electricity and protecting forests are key strategies to mitigate climate change." },
        { round: "Round 6", text: "A convex lens can form a real, inverted image of an object placed beyond its focal point.", type: "single", options: ["True", "False"], correct: [0], exp: "True. When an object is placed beyond the focal point of a convex lens, it forms a real and inverted image." },
        { round: "Round 6", text: "Which country won the 2025 ICC Champions Trophy in men's cricket?", type: "single", options: ["India", "Australia", "New Zealand", "South Africa"], correct: [0], exp: "India won the 2025 ICC Champions Trophy against New Zealand." }
    ];

    const flashcardsData = [
        { topic: "India's first individual Olympic gold medallist", fact: "Abhinav Bindra" },
        { topic: "Constitutional Article abolishing untouchability", fact: "Article 17" },
        { topic: "India's first successful lunar landing mission", fact: "Chandrayaan-3" },
        { topic: "Chemical symbol for tungsten", fact: "W" },
        { topic: "Blood component essential for clotting", fact: "Platelets" },
        { topic: "Organelle producing most ATP in aerobic respiration", fact: "Mitochondrion" },
        { topic: "Scientist who formulated the laws of planetary motion", fact: "Johannes Kepler" },
        { topic: "Author of Waiting for Godot", fact: "Samuel Beckett" },
        { topic: "Author of Things Fall Apart", fact: "Chinua Achebe" },
        { topic: "Instrument associated with Pandit Ravi Shankar", fact: "Sitar" },
        { topic: "Composer of The Four Seasons", fact: "Antonio Vivaldi" },
        { topic: "World's largest island, excluding continents", fact: "Greenland" },
        { topic: "Strait linking the Mediterranean and Atlantic", fact: "Strait of Gibraltar" },
        { topic: "UN organisation publishing the Human Development Report", fact: "UNDP" },
        { topic: "Winner of the 2025 ICC Champions Trophy", fact: "India (against New Zealand)" }
    ];

    // State tracking for each question
    const userAnswers = Array(quizData.length).fill(null).map(() => ({
        selected: [],
        submitted: false,
        revealed: false,
        isCorrect: false
    }));

    let currentQ = 0;
    let currentFact = 0;

    // Elements
    const qTitle = document.getElementById("round-title");
    const qText = document.getElementById("question-text");
    const qInst = document.getElementById("question-instruction");
    const optionsContainer = document.getElementById("options-container");
    const expBox = document.getElementById("explanation-box");
    const submitBtn = document.getElementById("submit-btn");
    const showAnsBtn = document.getElementById("show-answer-btn");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const progressFill = document.getElementById("progress-fill");
    const paletteGrid = document.getElementById("palette-grid");

    function initPalette() {
        paletteGrid.innerHTML = "";
        quizData.forEach((_, idx) => {
            const btn = document.createElement("button");
            btn.className = "palette-btn";
            btn.id = `palette-btn-${idx}`;
            btn.innerText = idx + 1;
            btn.onclick = () => jumpToQuestion(idx);
            paletteGrid.appendChild(btn);
        });
    }

    function updatePalette() {
        quizData.forEach((_, idx) => {
            const btn = document.getElementById(`palette-btn-${idx}`);
            btn.classList.toggle("active", idx === currentQ);
            btn.classList.toggle("answered", userAnswers[idx].submitted || userAnswers[idx].revealed);
        });
    }

    function loadQuestion() {
        const q = quizData[currentQ];
        const state = userAnswers[currentQ];

        qTitle.innerText = `${q.round} (Question ${currentQ + 1} of ${quizData.length})`;
        qText.innerText = q.text;
        qInst.innerText = q.type === "multi" ? "Select multiple answers:" : "Select one answer:";
        
        const answeredCount = userAnswers.filter(a => a.submitted || a.revealed).length;
        progressFill.style.width = `${(answeredCount / quizData.length) * 100}%`;

        optionsContainer.innerHTML = "";
        expBox.innerHTML = `<strong>Explanation:</strong> ${q.exp}`;

        prevBtn.disabled = (currentQ === 0);
        nextBtn.disabled = (currentQ === quizData.length - 1);

        q.options.forEach((opt, index) => {
            const label = document.createElement("label");
            label.className = "option-label";
            label.id = `label-${index}`;
            
            const input = document.createElement("input");
            input.type = q.type === "multi" ? "checkbox" : "radio";
            input.name = "quiz-option";
            input.value = index;
            input.checked = state.selected.includes(index);
            input.disabled = (state.submitted || state.revealed);

            input.onchange = () => {
                state.selected = getSelectedInputs();
            };

            label.appendChild(input);
            label.appendChild(document.createTextNode(opt));
            optionsContainer.appendChild(label);
        });

        if (state.submitted || state.revealed) {
            highlightAnswers();
            expBox.classList.remove("hidden");
            submitBtn.classList.add("hidden");
            showAnsBtn.classList.add("hidden");
        } else {
            expBox.classList.add("hidden");
            submitBtn.classList.remove("hidden");
            showAnsBtn.classList.remove("hidden");
        }

        updatePalette();
    }

    function getSelectedInputs() {
        const inputs = document.querySelectorAll('input[name="quiz-option"]:checked');
        return Array.from(inputs).map(i => parseInt(i.value));
    }

    function highlightAnswers() {
        const q = quizData[currentQ];
        const state = userAnswers[currentQ];

        q.options.forEach((_, i) => {
            const lbl = document.getElementById(`label-${i}`);
            if (q.correct.includes(i)) {
                lbl.classList.add("correct-bg");
            } else if (state.selected.includes(i)) {
                lbl.classList.add("incorrect-bg");
            }
        });
    }

    function lockQuestion(revealedOnly = false) {
        const q = quizData[currentQ];
        const state = userAnswers[currentQ];
        state.selected = getSelectedInputs();

        if (revealedOnly) {
            state.revealed = true;
            state.isCorrect = false;
        } else {
            state.submitted = true;
            const correctSet = [...q.correct].sort().join(",");
            const selectedSet = [...state.selected].sort().join(",");
            state.isCorrect = (correctSet === selectedSet);
        }

        document.querySelectorAll('input[name="quiz-option"]').forEach(i => i.disabled = true);
        highlightAnswers();
        expBox.classList.remove("hidden");
        submitBtn.classList.add("hidden");
        showAnsBtn.classList.add("hidden");
        updatePalette();

        const answeredCount = userAnswers.filter(a => a.submitted || a.revealed).length;
        progressFill.style.width = `${(answeredCount / quizData.length) * 100}%`;
    }

    function submitAnswer() {
        const selected = getSelectedInputs();
        if (selected.length === 0) {
            alert("Please select an answer first.");
            return;
        }
        lockQuestion(false);
    }

    function showAnswer() {
        lockQuestion(true);
    }

    function jumpToQuestion(idx) {
        currentQ = idx;
        loadQuestion();
    }

    function nextQuestion() {
        if (currentQ < quizData.length - 1) {
            currentQ++;
            loadQuestion();
        }
    }

    function prevQuestion() {
        if (currentQ > 0) {
            currentQ--;
            loadQuestion();
        }
    }

    function finishQuiz() {
        const totalCorrect = userAnswers.filter(a => a.isCorrect).length;

        document.getElementById("quiz-content").classList.add("hidden");
        document.getElementById("progress-bar").classList.add("hidden");
        document.getElementById("round-title").classList.add("hidden");
        document.querySelector(".palette-container").classList.add("hidden");

        const resultsDiv = document.getElementById("quiz-results");
        resultsDiv.classList.remove("hidden");
        document.getElementById("final-score").innerText = `${totalCorrect} / ${quizData.length}`;
    }

    function reviewQuestions() {
        document.getElementById("quiz-results").classList.add("hidden");
        document.getElementById("quiz-content").classList.remove("hidden");
        document.getElementById("progress-bar").classList.remove("hidden");
        document.getElementById("round-title").classList.remove("hidden");
        document.querySelector(".palette-container").classList.remove("hidden");
        currentQ = 0;
        loadQuestion();
    }

    // Flashcard Functions
    function startFlashcards() {
        document.getElementById("quiz-section").classList.add("hidden");
        document.getElementById("flashcard-section").classList.remove("hidden");
        loadFact();
    }

    function loadFact() {
        const f = flashcardsData[currentFact];
        document.getElementById("card-front").innerText = f.topic;
        document.getElementById("card-back").innerText = f.fact;
        document.getElementById("card-counter").innerText = `${currentFact + 1} / ${flashcardsData.length}`;
        document.getElementById("flashcard").classList.remove("is-flipped");
    }

    function flipCard() {
        document.getElementById("flashcard").classList.toggle("is-flipped");
    }

    function nextCard() {
        currentFact = (currentFact + 1) % flashcardsData.length;
        loadFact();
    }

    function prevCard() {
        currentFact = (currentFact - 1 + flashcardsData.length) % flashcardsData.length;
        loadFact();
    }

    initPalette();
    loadQuestion();
</script>
