<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science - Test 1</title>
    <style>
        :root { --primary: #2563eb; --primary-hover: #1d4ed8; --success: #16a34a; --danger: #dc2626; --background: #f8fafc; --surface: #ffffff; --text: #0f172a; --text-light: #64748b; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--background); color: var(--text); line-height: 1.5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 650px; width: 100%; background: var(--surface); padding: 28px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1, h2, h3 { text-align: center; margin-top: 0; } .hidden { display: none !important; }
        #progress-bar { height: 8px; background: #e2e8f0; border-radius: 4px; margin-bottom: 16px; overflow: hidden; }
        #progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }
        .palette-container { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #e2e8f0; }
        .palette-title { font-size: 0.85rem; font-weight: 600; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; text-align: center; }
        .palette-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; }
        .palette-btn { border: 1px solid #cbd5e1; background: #f8fafc; color: var(--text); padding: 6px 0; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
        .palette-btn:hover { background: #e2e8f0; } .palette-btn.active { border: 2px solid var(--primary); color: var(--primary); font-weight: 700; }
        .palette-btn.answered { background-color: var(--primary); color: white; border-color: var(--primary); }
        .palette-btn.active.answered { outline: 2px solid #0f172a; outline-offset: 1px; }
        .question-header { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; }
        .options-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .option-label { display: flex; align-items: center; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .option-label:hover { background-color: #f1f5f9; } .option-label.correct-bg { background-color: #dcfce7; border-color: var(--success); } .option-label.incorrect-bg { background-color: #fee2e2; border-color: var(--danger); }
        .option-label input { margin-right: 12px; transform: scale(1.2); }
        .btn { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; width: 100%; margin-bottom: 10px; }
        .btn:hover { background-color: var(--primary-hover); } .btn-outline { background-color: transparent; color: var(--primary); border: 2px solid var(--primary); } .btn-outline:hover { background-color: #eff6ff; } .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .explanation { background: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 0.95rem; border-left: 4px solid var(--primary); }
        .nav-controls { display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid #e2e8f0; padding-top: 15px; } .nav-controls .btn { margin-bottom: 0; flex: 1; }
        .flashcard-container { perspective: 1000px; width: 100%; height: 300px; margin: 30px 0; cursor: pointer; }
        .flashcard { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; border-radius: 12px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        .flashcard.is-flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; border-radius: 12px; font-size: 1.25rem; text-align: center; }
        .card-front { background-color: var(--primary); color: white; } .card-back { background-color: var(--surface); color: var(--text); border: 2px solid var(--primary); transform: rotateY(180deg); }
        .flashcard-controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; } .flashcard-controls button { width: auto; flex: 1; }
        .instruction { text-align: center; color: var(--text-light); font-size: 0.85rem; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div id="quiz-section">
        <h2 id="round-title">Science: Test 1 (Physics)</h2>
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <div class="palette-container"><div class="palette-title">Question Navigator</div><div class="palette-grid" id="palette-grid"></div></div>
        <div id="quiz-content">
            <div class="question-header" id="question-text">Loading question...</div>
            <div class="instruction" id="question-instruction"></div>
            <div class="options-grid" id="options-container"></div>
            <div id="explanation-box" class="explanation hidden"></div>
            <button id="submit-btn" class="btn" onclick="submitAnswer()">Submit Answer</button>
            <button id="show-answer-btn" class="btn btn-outline" onclick="showAnswer()">Show Answer & Explanation</button>
            <div class="nav-controls">
                <button id="prev-btn" class="btn btn-outline" onclick="prevQuestion()">← Previous</button>
                <button id="finish-btn" class="btn btn-outline" style="background:#16a34a;color:white;border-color:#16a34a;" onclick="finishQuiz()">Finish Quiz</button>
                <button id="next-btn" class="btn btn-outline" onclick="nextQuestion()">Next →</button>
            </div>
        </div>
        <div id="quiz-results" class="hidden">
            <h2>Quiz Complete!</h2>
            <h1 id="final-score">0 / 20</h1>
            <p style="text-align: center; margin-bottom: 25px;">Review finished! Proceed below to study the high-yield facts.</p>
            <button class="btn" onclick="startFlashcards()">Proceed to Topic Facts Flashcards</button>
            <button class="btn btn-outline" onclick="reviewQuestions()">Review Questions</button>
        </div>
    </div>
    <div id="flashcard-section" class="hidden">
        <h2>Topic Facts Flashcards</h2>
        <p class="instruction">Click or tap the card to flip between the Topic and the Fact.</p>
        <div class="flashcard-container" onclick="flipCard()"><div class="flashcard" id="flashcard"><div class="card-face card-front" id="card-front">Topic</div><div class="card-face card-back" id="card-back">Fact</div></div></div>
        <p style="text-align: center; font-weight: bold;" id="card-counter">1 / 5</p>
        <div class="flashcard-controls">
            <button class="btn btn-outline" onclick="prevCard()">Previous</button>
            <button class="btn btn-outline" onclick="nextCard()">Next</button>
        </div>
        <a href="index.html" style="text-decoration:none;"><button class="btn" style="margin-top: 20px;">Back to Main Menu</button></a>
    </div>
</div>
<script>
    const quizData = [
        { round: "Test 1", text: "A cyclist travels 150 m in 10 s. What is the cyclist's average speed?", type: "single", options: ["10 m/s", "12 m/s", "15 m/s", "20 m/s"], correct: [2], exp: "Average speed = distance ÷ time = 150 ÷ 10 = 15 m/s. Speed tells us how much distance is covered per unit time." },
        { round: "Test 1", text: "Which statement best describes Newton's first law of motion?", type: "single", options: ["Force always produces acceleration", "An object remains at rest or uniform motion unless acted on by a net external force", "Every action has an equal reaction", "Force equals mass times velocity"], correct: [1], exp: "Newton's first law is the law of inertia. A net external force is needed to change an object's velocity." },
        { round: "Test 1", text: "Why does a passenger tend to move forward when a moving bus stops suddenly?", type: "single", options: ["Gravity increases", "The passenger's inertia keeps the body moving", "Friction becomes zero", "The passenger becomes weightless"], correct: [1], exp: "The lower part of the body stops with the bus, while the upper body tends to continue moving due to inertia." },
        { round: "Test 1", text: "If the mass of an object is doubled while the net force stays the same, its acceleration becomes:", type: "single", options: ["Double", "Half", "Four times", "Unchanged"], correct: [1], exp: "From F = ma, acceleration a = F/m. With the same force, doubling mass halves acceleration." },
        { round: "Test 1", text: "A stone is thrown vertically upward. At its highest point, ignoring air resistance, its acceleration is:", type: "single", options: ["Zero", "Upward at g", "Downward at g", "Dependent on its mass"], correct: [2], exp: "Gravity acts throughout the flight. At the highest point the velocity is momentarily zero, but acceleration remains downward at about 9.8 m/s²." },
        { round: "Test 1", text: "Which form of energy is directly associated with an object because of its position in a gravitational field?", type: "single", options: ["Chemical energy", "Gravitational potential energy", "Nuclear energy", "Sound energy"], correct: [1], exp: "Gravitational potential energy depends on position. Near Earth's surface, it is approximately mgh." },
        { round: "Test 1", text: "A 60 N force moves an object 5 m in the direction of the force. How much work is done?", type: "single", options: ["12 J", "55 J", "300 J", "600 J"], correct: [2], exp: "Work = force × displacement in the force's direction = 60 × 5 = 300 J." },
        { round: "Test 1", text: "Two machines do the same amount of work, but Machine X does it in half the time. Compared with X, Machine Y has:", type: "single", options: ["Twice the power", "Half the power", "The same power", "Four times the power"], correct: [1], exp: "Power is the rate of doing work: P = W/t. Taking twice as long means half the power." },
        { round: "Test 1", text: "Why can a plane mirror form a clear image even though it does not produce light?", type: "single", options: ["It refracts all light", "It reflects light into the observer's eyes", "It absorbs light and re-emits it", "It creates light at the surface"], correct: [1], exp: "A plane mirror reflects incident light. The eye traces the reflected rays backward and perceives a virtual image behind the mirror." },
        { round: "Test 1", text: "When light passes from air into glass, which quantity remains unchanged?", type: "single", options: ["Speed", "Wavelength", "Frequency", "Direction"], correct: [2], exp: "The frequency of light is fixed by its source and remains unchanged at a boundary. Speed and wavelength change in a new medium." },
        { round: "Test 1", text: "Which phenomenon explains why a straw partly immersed in water appears bent?", type: "single", options: ["Reflection", "Refraction", "Diffraction", "Polarization"], correct: [1], exp: "Refraction is the change in direction of light when it passes between media in which it travels at different speeds." },
        { round: "Test 1", text: "The pitch of a sound is mainly determined by its:", type: "single", options: ["Amplitude", "Frequency", "Speed", "Loudness"], correct: [1], exp: "Frequency determines pitch: higher frequency means a higher-pitched sound. Amplitude is related to loudness." },
        { round: "Test 1", text: "A sound wave has a frequency of 500 Hz. How many complete vibrations occur in 2 seconds?", type: "single", options: ["250", "500", "1000", "1500"], correct: [2], exp: "500 vibrations occur each second, so in 2 s there are 500 × 2 = 1000 vibrations." },
        { round: "Test 1", text: "Which material is generally the best electrical conductor?", type: "single", options: ["Rubber", "Copper", "Glass", "Dry wood"], correct: [1], exp: "Copper has many mobile electrons and low electrical resistance, making it widely used for electrical wiring." },
        { round: "Test 1", text: "Why are household electrical appliances connected in parallel rather than in series?", type: "single", options: ["Each appliance receives the supply voltage independently", "Current becomes zero", "Total resistance is always greater", "Appliances cannot be switched off"], correct: [0], exp: "In a parallel circuit, each branch gets the supply voltage and appliances can operate independently." },
        { round: "Test 1", text: "A compass needle aligns roughly north-south because it responds to:", type: "single", options: ["Earth's gravitational field", "Earth's magnetic field", "Earth's electric field only", "Solar heat"], correct: [1], exp: "A compass needle is a small magnet. Earth's magnetic field exerts a torque that aligns it approximately along magnetic north-south." },
        { round: "Test 1", text: "Why does a metal spoon feel colder than a wooden spoon in the same room?", type: "single", options: ["Metal is always at a lower temperature", "Metal conducts heat away from your hand faster", "Wood produces heat", "Metal contains no thermal energy"], correct: [1], exp: "If both are at room temperature, metal feels colder because its higher thermal conductivity transfers heat from your hand more rapidly." },
        { round: "Test 1", text: "Why does a pressure cooker cook food faster?", type: "single", options: ["Pressure lowers the boiling point of water", "Pressure raises water's boiling point", "Pressure removes all water", "Pressure stops evaporation completely"], correct: [1], exp: "Higher pressure raises the boiling point of water, allowing food to cook at a higher temperature." },
        { round: "Test 1", text: "Which simple machine is a fixed pulley primarily used to provide?", type: "single", options: ["A change in the direction of effort", "Creation of energy", "Elimination of friction", "Unlimited mechanical advantage"], correct: [0], exp: "A fixed pulley mainly changes the direction of the applied force. It does not ideally multiply force by itself." },
        { round: "Test 1", text: "Why does a person often see lightning before hearing thunder?", type: "single", options: ["Thunder occurs later", "Light travels much faster than sound", "Sound cannot travel through air", "Lightning produces no sound"], correct: [1], exp: "Light travels at about 3 × 10⁸ m/s, far faster than sound in air, about 343 m/s at room temperature." }
    ];

    const flashcardsData = [
        { topic: "Newton's second-law formula", fact: "F = ma. Net force equals mass × acceleration." },
        { topic: "What power measures", fact: "The rate of doing work: P = W/t, measured in watts (W)." },
        { topic: "Why a pressure cooker speeds cooking", fact: "Higher pressure raises water's boiling point, allowing hotter cooking." },
        { topic: "What determines sound pitch", fact: "Frequency: higher frequency means higher pitch." },
        { topic: "Atomic number meaning", fact: "The number of protons in an atom's nucleus." }
    ];

    const userAnswers = Array(quizData.length).fill(null).map(() => ({ selected: [], submitted: false, revealed: false, isCorrect: false }));
    let currentQ = 0; let currentFact = 0;
    const qTitle = document.getElementById("round-title"), qText = document.getElementById("question-text"), qInst = document.getElementById("question-instruction"), optionsContainer = document.getElementById("options-container"), expBox = document.getElementById("explanation-box"), submitBtn = document.getElementById("submit-btn"), showAnsBtn = document.getElementById("show-answer-btn"), prevBtn = document.getElementById("prev-btn"), nextBtn = document.getElementById("next-btn"), progressFill = document.getElementById("progress-fill"), paletteGrid = document.getElementById("palette-grid");

    function initPalette() { paletteGrid.innerHTML = ""; quizData.forEach((_, idx) => { const btn = document.createElement("button"); btn.className = "palette-btn"; btn.id = `palette-btn-${idx}`; btn.innerText = idx + 1; btn.onclick = () => jumpToQuestion(idx); paletteGrid.appendChild(btn); }); }
    function updatePalette() { quizData.forEach((_, idx) => { const btn = document.getElementById(`palette-btn-${idx}`); btn.classList.toggle("active", idx === currentQ); btn.classList.toggle("answered", userAnswers[idx].submitted || userAnswers[idx].revealed); }); }
    function loadQuestion() { const q = quizData[currentQ]; const state = userAnswers[currentQ]; qTitle.innerText = `${q.round} (Question ${currentQ + 1} of ${quizData.length})`; qText.innerText = q.text; qInst.innerText = q.type === "multi" ? "Select multiple answers:" : "Select one answer:"; progressFill.style.width = `${(userAnswers.filter(a => a.submitted || a.revealed).length / quizData.length) * 100}%`; optionsContainer.innerHTML = ""; expBox.innerHTML = `<strong>Explanation:</strong> ${q.exp}`; prevBtn.disabled = (currentQ === 0); nextBtn.disabled = (currentQ === quizData.length - 1); q.options.forEach((opt, index) => { const label = document.createElement("label"); label.className = "option-label"; label.id = `label-${index}`; const input = document.createElement("input"); input.type = q.type === "multi" ? "checkbox" : "radio"; input.name = "quiz-option"; input.value = index; input.checked = state.selected.includes(index); input.disabled = (state.submitted || state.revealed); input.onchange = () => { state.selected = getSelectedInputs(); }; label.appendChild(input); label.appendChild(document.createTextNode(opt)); optionsContainer.appendChild(label); }); if (state.submitted || state.revealed) { highlightAnswers(); expBox.classList.remove("hidden"); submitBtn.classList.add("hidden"); showAnsBtn.classList.add("hidden"); } else { expBox.classList.add("hidden"); submitBtn.classList.remove("hidden"); showAnsBtn.classList.remove("hidden"); } updatePalette(); }
    function getSelectedInputs() { return Array.from(document.querySelectorAll('input[name="quiz-option"]:checked')).map(i => parseInt(i.value)); }
    function highlightAnswers() { const q = quizData[currentQ]; const state = userAnswers[currentQ]; q.options.forEach((_, i) => { const lbl = document.getElementById(`label-${i}`); if (q.correct.includes(i)) { lbl.classList.add("correct-bg"); } else if (state.selected.includes(i)) { lbl.classList.add("incorrect-bg"); } }); }
    function lockQuestion(revealedOnly = false) { const q = quizData[currentQ]; const state = userAnswers[currentQ]; state.selected = getSelectedInputs(); if (revealedOnly) { state.revealed = true; state.isCorrect = false; } else { state.submitted = true; state.isCorrect = ([...q.correct].sort().join(",") === [...state.selected].sort().join(",")); } document.querySelectorAll('input[name="quiz-option"]').forEach(i => i.disabled = true); highlightAnswers(); expBox.classList.remove("hidden"); submitBtn.classList.add("hidden"); showAnsBtn.classList.add("hidden"); updatePalette(); progressFill.style.width = `${(userAnswers.filter(a => a.submitted || a.revealed).length / quizData.length) * 100}%`; }
    function submitAnswer() { if (getSelectedInputs().length === 0) { alert("Please select an answer first."); return; } lockQuestion(false); }
    function showAnswer() { lockQuestion(true); }
    function jumpToQuestion(idx) { currentQ = idx; loadQuestion(); }
    function nextQuestion() { if (currentQ < quizData.length - 1) { currentQ++; loadQuestion(); } }
    function prevQuestion() { if (currentQ > 0) { currentQ--; loadQuestion(); } }
    function finishQuiz() { document.getElementById("quiz-content").classList.add("hidden"); document.getElementById("progress-bar").classList.add("hidden"); document.getElementById("round-title").classList.add("hidden"); document.querySelector(".palette-container").classList.add("hidden"); document.getElementById("quiz-results").classList.remove("hidden"); document.getElementById("final-score").innerText = `${userAnswers.filter(a => a.isCorrect).length} / ${quizData.length}`; }
    function reviewQuestions() { document.getElementById("quiz-results").classList.add("hidden"); document.getElementById("quiz-content").classList.remove("hidden"); document.getElementById("progress-bar").classList.remove("hidden"); document.getElementById("round-title").classList.remove("hidden"); document.querySelector(".palette-container").classList.remove("hidden"); currentQ = 0; loadQuestion(); }
    function startFlashcards() { document.getElementById("quiz-section").classList.add("hidden"); document.getElementById("flashcard-section").classList.remove("hidden"); loadFact(); }
    function loadFact() { const f = flashcardsData[currentFact]; document.getElementById("card-front").innerText = f.topic; document.getElementById("card-back").innerText = f.fact; document.getElementById("card-counter").innerText = `${currentFact + 1} / ${flashcardsData.length}`; document.getElementById("flashcard").classList.remove("is-flipped"); }
    function flipCard() { document.getElementById("flashcard").classList.toggle("is-flipped"); }
    function nextCard() { currentFact = (currentFact + 1) % flashcardsData.length; loadFact(); }
    function prevCard() { currentFact = (currentFact - 1 + flashcardsData.length) % flashcardsData.length; loadFact(); }
    initPalette(); loadQuestion();
</script>
</body>
</html>
